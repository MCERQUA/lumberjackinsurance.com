  <form name="quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="quote" />
  <input name="bot-field" />

  <input name="coverage" />
  <input name="email" />

  <!--
    insurance-agency-multiline: /quote shows ONE detail section chosen by the
    coverage select and disables the other, so a native POST carries only
    what was on screen. Netlify stores only names it has seen declared, so
    this declares the UNION of both sections.
  -->

  <input name="mailing_address" />
  <input name="city" />

  <form name="contact" netlify netlify-honeypot="bot-field" hidden>

    <input name="bot-field">
    <input name="name"><input name="email" type="email"><input name="phone" type="tel">
